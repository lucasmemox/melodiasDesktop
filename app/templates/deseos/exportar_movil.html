<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Cuervo Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
        }
        .header-metal {
            border-bottom: 3px solid #dc3545;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .item-row {
            background: #1a1a1a;
            border-left: 4px solid #dc3545;
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
        }
        .item-row.alta { border-left-color: #dc3545; }
        .item-row.media { border-left-color: #ffc107; }
        .item-row.baja { border-left-color: #0dcaf0; }

        @media print {
            body { background-color: #fff !important; color: #000 !important; }
            .item-row { background: #fff !important; border: 1px solid #ccc !important; border-left: 5px solid #000 !important; color: #000 !important; }
            .no-print { display: none !important; }
            .text-danger { color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="header-metal d-flex justify-content-between align-items-center">
        <div>
            <!-- Muestra el nickname del usuario en mayúsculas, o el username si no tiene nickname -->
            <h3 class="text-danger fw-bold m-0 text-uppercase">
                {{ current_user.nickname or current_user.username }}
            </h3>
            <small class="fw-semibold" style="color: #b0b0b0;">Lista de Búsqueda / Wishlist ({{ deseos|length }} ítems)</small>
        </div>
        <button class="btn btn-outline-danger btn-sm no-print" onclick="window.print()">
            Imprimir / PDF
        </button>
    </div>

    <div class="list-container">
        {% for d in deseos %}
        <div class="item-row {{ d.prioridad.lower() }} d-flex justify-content-between align-items-center">
            <div>
                <strong class="text-light d-block fs-5">{{ d.banda }}</strong>
                <span class="text-danger fst-italic">{{ d.disco }}</span>
            </div>
            <div class="text-end">
                <span class="badge bg-secondary d-block mb-1">{{ d.formato.nombre }}</span>
                <small class="text-muted uppercase fw-bold" style="font-size: 0.7rem;">Prio: {{ d.prioridad }}</small>
            </div>
        </div>
        {% else %}
        <p class="text-center text-muted">No hay elementos en la lista.</p>
        {% endfor %}
    </div>

</body>
</html>
